<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OWL-v2 Object Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .media-container {
            position: relative;
            display: inline-block;
            background: #000;
            border-radius: 0.375rem;
            overflow: hidden;
            max-width: 100%;
        }
        video, img {
            display: block;
            max-width: 100%;
            height: auto;
        }
        canvas.overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .nav-tabs .nav-link {
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="text-center mb-5">
        <h1 class="display-5 fw-bold text-primary">OWL-v2 Vision Engine</h1>
        <p class="lead text-muted">Zero-shot object detection via REST and WebSockets</p>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-dark text-white fw-semibold">
            Target Labels
        </div>
        <div class="card-body">
            <label for="labelsInput" class="form-label">Objects to detect (comma separated):</label>
            <input type="text" class="form-control form-control-lg" id="labelsInput" value="a person, a cell phone, a coffee cup" placeholder="e.g. a cat, a dog, a car...">
        </div>
    </div>

    <div class="row">
        <div class="col-lg-6 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-primary text-white fw-semibold">
                    Static Detection (/upload)
                </div>
                <div class="card-body">
                    <ul class="nav nav-tabs mb-3" id="staticTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="upload-tab" data-bs-toggle="tab" data-bs-target="#upload-pane" type="button" role="tab">Upload File</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="capture-tab" data-bs-toggle="tab" data-bs-target="#capture-pane" type="button" role="tab">Take Photo</button>
                        </li>
                    </ul>

                    <div class="tab-content" id="myTabContent">
                        <div class="tab-pane fade show active" id="upload-pane" role="tabpanel">
                            <div class="input-group mb-3">
                                <input type="file" class="form-control" id="imageUpload" accept="image/*">
                                <button class="btn btn-primary" id="uploadBtn">Detect</button>
                            </div>
                        </div>

                        <div class="tab-pane fade" id="capture-pane" role="tabpanel">
                            <div class="d-grid gap-2 mb-3">
                                <button class="btn btn-outline-primary" id="startStaticCamBtn">Start Camera</button>
                            </div>
                            <div class="text-center mb-3" id="staticCamWrapper" style="display: none;">
                                <video id="staticWebcam" autoplay playsinline muted class="rounded img-fluid mb-2 border"></video>
                                <button class="btn btn-danger w-100" id="captureBtn">📸 Snap & Detect</button>
                            </div>
                        </div>
                    </div>

                    <div class="text-center">
                        <span id="uploadStatus" class="text-muted small d-block mb-2"></span>
                        <div class="media-container shadow-sm" id="staticContainer" style="display: none;">
                            <img id="staticImg" src="" alt="Captured or Uploaded Image">
                            <canvas id="staticCanvas" class="overlay"></canvas>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <div class="col-lg-6 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-success text-white fw-semibold">
                    Live Video Feed (WebSocket)
                </div>
                <div class="card-body text-center">
                    <div class="mb-3 d-flex justify-content-center gap-2">
                        <button class="btn btn-success" id="startLiveCamBtn">Start Live Stream</button>
                        <button class="btn btn-outline-danger" id="stopLiveCamBtn" disabled>Stop</button>
                    </div>
                    <span id="wsStatus" class="badge bg-secondary mb-3">Disconnected</span>

                    <div class="media-container shadow-sm w-100" id="liveContainer" style="display: none;">
                        <video id="liveWebcam" autoplay playsinline muted></video>
                        <canvas id="liveCanvas" class="overlay"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // --- Configuration ---
    const API_URL = window.location.origin;
    const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const WS_URL = `${wsProtocol}//${window.location.host}/ws/live`;

    // --- Color Palette Generator for Classes ---
    const colorPalette = [
        '#e6194B', '#3cb44b', '#ffe119', '#4363d8', '#f58231', '#911eb4', '#42d4f4', '#f032e6',
        '#bfef45', '#fabed4', '#469990', '#dcbeff', '#9A6324', '#fffac8', '#800000', '#aaffc3'
    ];
    const classColors = {};
    function getColorForLabel(label) {
        const cleanLabel = label.toLowerCase().trim();
        if (!classColors[cleanLabel]) {
            classColors[cleanLabel] = colorPalette[Object.keys(classColors).length % colorPalette.length];
        }
        return classColors[cleanLabel];
    }

    // --- DOM Elements ---
    const labelsInput = document.getElementById('labelsInput');

    // Static Upload / Capture Elements
    const imageUpload = document.getElementById('imageUpload');
    const uploadBtn = document.getElementById('uploadBtn');
    const startStaticCamBtn = document.getElementById('startStaticCamBtn');
    const staticCamWrapper = document.getElementById('staticCamWrapper');
    const staticWebcam = document.getElementById('staticWebcam');
    const captureBtn = document.getElementById('captureBtn');
    const uploadStatus = document.getElementById('uploadStatus');
    const staticImg = document.getElementById('staticImg');
    const staticCanvas = document.getElementById('staticCanvas');
    const staticContainer = document.getElementById('staticContainer');

    // Live Webcam Elements
    const startLiveCamBtn = document.getElementById('startLiveCamBtn');
    const stopLiveCamBtn = document.getElementById('stopLiveCamBtn');
    const wsStatus = document.getElementById('wsStatus');
    const liveWebcam = document.getElementById('liveWebcam');
    const liveCanvas = document.getElementById('liveCanvas');
    const liveContainer = document.getElementById('liveContainer');

    // State Variables
    let ws = null;
    let liveStream = null;
    let staticStream = null;
    let isLiveStreaming = false;
    const hiddenCaptureCanvas = document.createElement('canvas');

    // --- Helper: Draw Bounding Boxes ---
    function drawBoxes(canvas, imageElement, predictions) {
        canvas.width = imageElement.naturalWidth || imageElement.videoWidth;
        canvas.height = imageElement.naturalHeight || imageElement.videoHeight;

        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        predictions.forEach(pred => {
            const [xmin, ymin, xmax, ymax] = pred.box;
            const width = xmax - xmin;
            const height = ymax - ymin;
            const labelText = pred.label || 'object';
            const color = getColorForLabel(labelText);

            // Draw Box
            ctx.strokeStyle = color;
            ctx.lineWidth = 4;
            ctx.strokeRect(xmin, ymin, width, height);

            // Draw Label Background
            ctx.fillStyle = color;
            ctx.font = 'bold 18px system-ui';
            const text = `${labelText} ${(pred.score * 100).toFixed(0)}%`;
            const textWidth = ctx.measureText(text).width;
            ctx.fillRect(xmin, ymin - 25, textWidth + 10, 25);

            // Draw Label Text
            ctx.fillStyle = '#ffffff'; // White text for contrast against colored background
            ctx.fillText(text, xmin + 5, ymin - 7);
        });
    }

    // --- Feature 1A: Static Image Upload ---
    uploadBtn.addEventListener('click', async () => {
        if (!imageUpload.files[0]) return alert("Please select an image first.");
        await submitStaticImage(imageUpload.files[0]);
    });

    // --- Feature 1B: Static Webcam Capture ---
    startStaticCamBtn.addEventListener('click', async () => {
        try {
            stopLiveCamera(); // Ensure live cam isn't using the resource
            staticStream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
            staticWebcam.srcObject = staticStream;
            startStaticCamBtn.style.display = 'none';
            staticCamWrapper.style.display = 'block';
        } catch (err) {
            alert("Could not access camera: " + err.message);
        }
    });

    captureBtn.addEventListener('click', () => {
        // Draw current video frame to hidden canvas
        hiddenCaptureCanvas.width = staticWebcam.videoWidth;
        hiddenCaptureCanvas.height = staticWebcam.videoHeight;
        hiddenCaptureCanvas.getContext('2d').drawImage(staticWebcam, 0, 0);

        // Convert to blob and submit
        hiddenCaptureCanvas.toBlob(async (blob) => {
            const file = new File([blob], "capture.jpg", { type: "image/jpeg" });
            await submitStaticImage(file);
        }, 'image/jpeg', 0.9);
    });

    // Cleanup static cam when switching tabs
    document.getElementById('upload-tab').addEventListener('click', stopStaticCamera);

    function stopStaticCamera() {
        if (staticStream) staticStream.getTracks().forEach(t => t.stop());
        staticCamWrapper.style.display = 'none';
        startStaticCamBtn.style.display = 'inline-block';
    }

    // --- Helper: Submit File/Blob to REST API ---
    async function submitStaticImage(file) {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('text_prompt', labelsInput.value);

        staticImg.src = URL.createObjectURL(file);
        staticContainer.style.display = "inline-block";
        staticCanvas.getContext('2d').clearRect(0, 0, staticCanvas.width, staticCanvas.height);

        uploadStatus.textContent = "Processing image...";
        uploadStatus.className = "text-primary small d-block mb-2";

        try {
            const response = await fetch(`${API_URL}/upload`, { method: 'POST', body: formData });
            const result = await response.json();

            if (result.status === "success") {
                staticImg.onload = () => drawBoxes(staticCanvas, staticImg, result.data);
                uploadStatus.textContent = "Detection complete.";
                uploadStatus.className = "text-success fw-bold small d-block mb-2";
            } else {
                uploadStatus.textContent = "Error processing image.";
                uploadStatus.className = "text-danger fw-bold small d-block mb-2";
            }
        } catch (err) {
            uploadStatus.textContent = "Request failed.";
            uploadStatus.className = "text-danger fw-bold small d-block mb-2";
            console.error(err);
        }
    }

    // --- Feature 2: Live Webcam via WebSocket ---
    startLiveCamBtn.addEventListener('click', async () => {
        try {
            stopStaticCamera(); // Ensure static cam isn't using the resource
            liveStream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
            liveWebcam.srcObject = liveStream;
            liveContainer.style.display = "inline-block";

            startLiveCamBtn.disabled = true;
            stopLiveCamBtn.disabled = false;
            isLiveStreaming = true;

            liveWebcam.onloadedmetadata = () => {
                hiddenCaptureCanvas.width = liveWebcam.videoWidth;
                hiddenCaptureCanvas.height = liveWebcam.videoHeight;
                connectWebSocket();
            };
        } catch (err) {
            alert("Could not access camera: " + err.message);
        }
    });

    stopLiveCamBtn.addEventListener('click', stopLiveCamera);

    function stopLiveCamera() {
        isLiveStreaming = false;
        if (liveStream) liveStream.getTracks().forEach(track => track.stop());
        if (ws) ws.close();

        startLiveCamBtn.disabled = false;
        stopLiveCamBtn.disabled = true;
        wsStatus.textContent = "Disconnected";
        wsStatus.className = "badge bg-secondary mb-3";
        liveContainer.style.display = "none";
    }

    function connectWebSocket() {
        wsStatus.textContent = "Connecting...";
        wsStatus.className = "badge bg-warning text-dark mb-3";
        ws = new WebSocket(WS_URL);

        ws.onopen = () => {
            wsStatus.textContent = "Streaming & Detecting...";
            wsStatus.className = "badge bg-success mb-3";
            const targetLabels = labelsInput.value.split(',').map(s => s.trim());
            ws.send(JSON.stringify({ labels: targetLabels }));
            captureAndSendFrame();
        };

        ws.onmessage = (event) => {
            const response = JSON.parse(event.data);
            if (response.status === "success" && isLiveStreaming) {
                drawBoxes(liveCanvas, liveWebcam, response.data);
            }
            if (isLiveStreaming) requestAnimationFrame(captureAndSendFrame);
        };

        ws.onerror = () => {
            wsStatus.textContent = "Connection Error";
            wsStatus.className = "badge bg-danger mb-3";
        };

        ws.onclose = () => { if (isLiveStreaming) stopLiveCamera(); };
    }

    function captureAndSendFrame() {
        if (!isLiveStreaming || ws.readyState !== WebSocket.OPEN) return;
        const ctx = hiddenCaptureCanvas.getContext('2d');
        ctx.drawImage(liveWebcam, 0, 0, hiddenCaptureCanvas.width, hiddenCaptureCanvas.height);
        hiddenCaptureCanvas.toBlob((blob) => {
            ws.send(blob);
        }, 'image/jpeg', 0.6); // Slightly lower quality for faster WebSocket transport
    }
</script>
</body>
</html>
